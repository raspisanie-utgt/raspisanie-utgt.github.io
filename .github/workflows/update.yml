name: Проверка замен и деплой сайта

on:
  schedule:
    # каждый час с 06:47 до 21:47 по Москве (cron в UTC)
    - cron: "47 3-18 * * *"
  # запуск по сигналу: сторож на почте расписания (tools/storozh.gs) раз в 5 минут смотрит страницу
  # замен и, как только там что-то меняется, запускает эту проверку, не дожидаясь часа
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ветка как она есть сейчас, а не на момент постановки в очередь: запуск, ждавший в очереди
      # (час и сигнал сторожа совпали), иначе работал бы со старыми данными
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # сначала pip: если tesseract не поставится, сигналу о сбое (tools/health.py) всё равно нужен requests
      - run: pip install -r requirements.txt

      - name: Установить tesseract (русский; английский — для чтения одних цифр)
        id: setup
        # без apt-get update (это долго, и его сбой ронял всё); не вышло — с update
        run: |
          P="tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng"
          sudo apt-get install -y -q $P || { sudo apt-get update -q && sudo apt-get install -y -q $P; }

      # тесты — только когда меняется код (push); ежечасная проверка и сигнал сторожа их не ждут:
      # новое распоряжение появляется на сайте на ~7 минут быстрее, и тесты не могут остановить обновления
      - name: Тесты
        id: tests
        if: github.event_name == 'push'
        run: |
          python -m pytest tests -q
          node --test tests/agenda.test.js tests/calendar.test.js tests/teachers.test.js

      - name: Проверить страницу замен
        id: scrape
        continue-on-error: true
        run: python scraper.py

      - name: Архив замен (хранится навсегда, сжатый)
        continue-on-error: true
        run: python tools/archive.py

      - name: Новости техникума
        id: news
        continue-on-error: true
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: python tools/news.py

      - name: Полные ФИО преподавателей
        continue-on-error: true
        run: python tools/teachers.py

      - name: Исходные PDF (расписание, звонки, график, педсостав) — поменялись -> задача
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ASSIGNEE: olegskorostrel-wq
        run: python tools/sources.py

      - name: Проверка данных (опечатки, накладки, сомнительные замены — отчёт в логе)
        continue-on-error: true
        run: python tools/check_data.py

      - name: Сигнал о сбое (3 неудачи подряд -> задача и пуш)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ASSIGNEE: olegskorostrel-wq
        run: >-
          python tools/health.py --setup ${{ steps.setup.outcome }}
          --scrape ${{ steps.scrape.outcome }} --news ${{ steps.news.outcome }}

      - name: Сохранить новые замены и новости в репозиторий
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git add data/zameny data/archive data/news.json data/teachers.json data/health.json data/sources.json
          if git diff --cached --quiet; then
            echo "Новых замен и новостей нет"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Замены и новости: обновление $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M')"
            # если за время проверки в main успели что-то отправить — подтянуть и отправить снова
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main || { git rebase --abort; exit 1; }
            done
            exit 1
          fi

      - name: Собрать сайт
        run: python build_site.py ${{ steps.scrape.outcome == 'failure' && '--scrape-failed' || '' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

      - name: Проверка замен упала
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::scraper.py завершился с ошибкой — сайт собран со старыми данными"

      # упало то, что само не пройдёт (сохранение, сборка, установка) — сразу задача, без счётчика
      - name: Сигнал о поломке
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ASSIGNEE: olegskorostrel-wq
        run: python tools/health.py --alarm "упал шаг ежечасной проверки (сохранение, сборка или установка)"

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
