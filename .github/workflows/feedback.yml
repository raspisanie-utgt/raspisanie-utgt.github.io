name: Сообщения из Telegram в задачи

on:
  schedule:
    # каждые 15 минут (GitHub может запускать с задержкой)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: tg-poll
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Забрать сообщения из бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # кому назначать новые сообщения (приходит пуш «Assigned» в приложении GitHub)
          FEEDBACK_ASSIGNEE: olegskorostrel-wq
        run: python tools/tg_feedback.py
