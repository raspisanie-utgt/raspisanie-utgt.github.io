name: Тесты предложений правок

# Предложения правок (pull request) — например, от dependabot с новыми версиями действий — проходят тесты
# до того, как попадут в main. Ничего не сохраняет и не выкладывает.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Установить tesseract
        run: |
          P="tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng"
          sudo apt-get install -y -q $P || { sudo apt-get update -q && sudo apt-get install -y -q $P; }
      - name: Тесты
        run: |
          python -m pytest tests -q
          node --test tests/agenda.test.js tests/calendar.test.js tests/teachers.test.js
          python build_site.py
